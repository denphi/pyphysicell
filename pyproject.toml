[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyphysicell"
version = "0.1.4"
description = "An independent Python reimplementation of PhysiCell 1.14.2, with C++ computation kernels"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
authors = [{name = "Daniel Mejia", email = "dmejiapa@purdue.edu"}]
maintainers = [{name = "Daniel Mejia", email = "dmejiapa@purdue.edu"}]
keywords = ["agent-based-modeling", "systems-biology", "physicell", "biofvm",
            "multicellular", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# 1.20.3 is what nanoHUB's default 3.8 kernel ships, and the suite passes
# against it; the old >=1.24 floor was a guess that forced an upgrade
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/denphi/pyphysicell"
Source = "https://github.com/denphi/pyphysicell"
Issues = "https://github.com/denphi/pyphysicell/issues"

[project.optional-dependencies]
# floors are what is actually tested, not guessed: nanoHUB's default 3.8
# kernel ships matplotlib 3.4.2, and a higher floor would make
# pip upgrade matplotlib in a shared environment just to add a plot
notebooks = ["matplotlib>=3.3", "pandas>=1.3", "jupyterlab>=3"]
dev = ["pytest>=7", "nbconvert>=7", "nbclient>=0.9"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
pyphysicell = ["kernels.cpp"]

[tool.cibuildwheel]
# One interpreter per platform is enough: the kernels call no CPython API, so
# setup.py tags the wheel py3-none-<platform> and the same file serves every
# Python from 3.8 up. Building four would just produce four identical wheels
# that overwrite each other.
build = "cp312-*"
skip = "*-musllinux_i686 *_i686 *-win32"
test-requires = "numpy"
test-command = "python -c \"import pyphysicell, pyphysicell._kernels as k; print(k.BACKEND, k.MAX_THREADS); assert k.BUILD_TAG == 'prebuilt', k.BUILD_TAG\""

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
# NOT the manylinux2014 default: modern NumPy ships no wheel for glibc 2.17,
# so pip builds it from source in the container and manylinux2014's GCC 10.2
# is below NumPy's 10.3 floor. Our own wheel builds there fine; installing its
# dependency is what fails.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
