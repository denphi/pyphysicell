name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: ["python/pyphysicell/kernels.cpp", "setup.py", "pyproject.toml", ".github/workflows/wheels.yml"]

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: aarch64}
          - {os: macos-13,       arch: x86_64}   # Intel runner
          - {os: macos-14,       arch: arm64}    # Apple silicon runner
          - {os: windows-latest, arch: AMD64}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with: {name: sdist, path: dist/*.tar.gz}

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no API token in secrets
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - uses: pypa/gh-action-pypi-publish@release/v1
